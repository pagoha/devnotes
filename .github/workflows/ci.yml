name: DevNotes CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Validate repository structure
      - name: Validate repository structure
        run: |
          test -f README.md
          test -d notes
          test -d snippets
          test -d scripts
          echo 'Repository structure validated'

      # 3️⃣ Markdown linting
      - name: Install Node dependencies
        run: npm ci

      # 4️⃣ Markdown linting and spell check
      - name: Validate Markdown and spelling
        run: npm run lint:all
